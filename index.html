<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>대순회보 뷰어</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Daesoon Webzine Archive</p>
        <h1>대순회보를 로컬에서 탐색하고 읽기</h1>
        <p id="heroMeta" class="hero-copy">데이터를 불러오는 중입니다.</p>
      </div>
      <a class="hero-link" href="https://webzine.daesoon.org/" target="_blank" rel="noreferrer">원 사이트 열기</a>
    </header>

    <section class="toolbar panel">
      <label class="field grow">
        <span>검색</span>
        <input id="searchInput" type="search" placeholder="제목, 필자, 본문으로 검색" />
      </label>
      <label class="field">
        <span>카테고리</span>
        <select id="categorySelect"></select>
      </label>
    </section>

    <main class="workspace">
      <aside class="panel issue-panel">
        <div class="panel-head">
          <h2>호수</h2>
          <p id="issueStats" class="muted"></p>
        </div>
        <div id="issueList" class="issue-list"></div>
      </aside>

      <section class="content-stack">
        <section class="panel list-panel">
          <div class="panel-head">
            <h2>기사 목록</h2>
            <p id="resultMeta" class="muted"></p>
          </div>
          <div id="articleList" class="article-list"></div>
        </section>

        <article class="panel reader-panel">
          <div id="articleEmpty" class="empty-state">
            기사를 선택하면 본문이 여기 표시됩니다.
          </div>

          <div id="articleView" class="article-view is-hidden">
            <div class="article-top">
              <div>
                <p id="articleIssue" class="muted"></p>
                <p id="articleCategory" class="article-category"></p>
                <h2 id="articleTitle"></h2>
                <p id="articleAuthor" class="article-author"></p>
              </div>
              <a id="articleSourceLink" class="hero-link small" href="#" target="_blank" rel="noreferrer">원문 보기</a>
            </div>
            <div id="articleBody" class="article-body"></div>
          </div>
        </article>
      </section>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
