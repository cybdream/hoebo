<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>대순회보 뷰어</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260504" />
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Daesoon Webzine Archive</p>
        <h1>대순회보를 로컬에서 탐색하고 읽기</h1>
        <p id="heroMeta" class="hero-copy">데이터를 불러오는 중입니다.</p>
      </div>
      <div class="hero-actions">
        <a id="issuePdfLink" class="hero-link small" href="#" target="_blank" rel="noreferrer noopener" hidden>PDF 다운로드</a>
        <a class="hero-link" href="https://webzine.daesoon.org/" target="_blank" rel="noreferrer noopener">원 사이트 열기</a>
      </div>
    </header>

    <section class="toolbar panel">
      <label class="field grow">
        <span>검색</span>
        <input id="searchInput" type="search" placeholder="제목, 필자, 본문으로 검색" />
      </label>
      <label id="categoryField" class="field">
        <span>카테고리</span>
        <select id="categorySelect"></select>
      </label>
    </section>

    <button id="mobileIssuePanelToggle" class="mobile-issue-toggle" type="button" aria-controls="issuePanel" aria-expanded="false">
      호수/코너 목록 열기
    </button>

    <main class="workspace">
      <aside id="issuePanel" class="panel issue-panel">
        <div class="view-tabs">
          <button id="tabIssue" class="view-tab is-active" type="button">호수별</button>
          <button id="tabCorner" class="view-tab" type="button">코너별</button>
        </div>

        <div id="issueNav" class="issue-nav">
          <button id="prevIssueBtn" class="issue-nav-btn" type="button">◀ 이전호</button>
          <select id="issueSelect" class="issue-select"></select>
          <button id="nextIssueBtn" class="issue-nav-btn" type="button">다음호 ▶</button>
        </div>

        <div id="issueCoverWrap" class="issue-cover-wrap" hidden>
          <button id="issueCoverToggle" class="issue-cover-toggle-btn" type="button">표지 ▾</button>
          <img id="issueCoverImg" class="issue-cover-img" src="" alt="" loading="lazy" hidden />
        </div>

        <div id="cornerList" class="corner-list" hidden></div>
      </aside>

      <section class="content-stack">
        <section class="panel list-panel">
          <div class="panel-head">
            <h2>기사 목록</h2>
            <p id="resultMeta" class="muted"></p>
          </div>
          <div id="articleList" class="article-list"></div>
        </section>

        <article class="panel reader-panel">
          <div id="articleEmpty" class="empty-state">
            기사를 선택하면 본문이 여기 표시됩니다.
          </div>

          <div id="articleView" class="article-view is-hidden">
            <div class="article-top">
              <div>
                <p id="articleIssue" class="muted"></p>
                <p id="articleCategory" class="article-category"></p>
                <h2 id="articleTitle"></h2>
                <p id="articleAuthor" class="article-author"></p>
              </div>
              <a id="articleSourceLink" class="hero-link small" href="#" target="_blank" rel="noreferrer noopener">원문 보기</a>
            </div>
            <div id="articleBody" class="article-body"></div>
          </div>
        </article>
      </section>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
